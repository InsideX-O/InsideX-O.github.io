.agbox .agmain .name{margin:0}
.agcount{justify-self:start;margin-top:3px;font-size:11px;line-height:1;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap;width:max-content}
.agside2{display:grid;gap:6px;justify-items:stretch;align-self:center}
.agside2 .tag{margin:0;text-align:center;font-size:12px;padding:3px 8px;white-space:nowrap}
.agbtns{display:grid;grid-template-columns:repeat(3,30px);gap:6px}
.agbtns .icon.small{margin:0;width:30px;height:30px}
.dlrows{display:grid;gap:8px;margin-top:12px}
.dlrows .dlrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:0;min-height:30px}
.dlrows .btnlink.dl{margin:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;height:30px;box-sizing:border-box;font-size:13px;line-height:1;white-space:nowrap;flex:none}
.dlnote{display:inline-flex;align-items:center;height:30px;flex:0 1 auto;min-width:0;font-size:13px;line-height:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.agrow>div{min-width:0}
.acts,.cmd,.chrow .acts{align-items:center}
.acts button,.cmd button,.chrow button{margin-top:0}
button.small:not(.icon){min-height:30px;display:inline-flex;align-items:center;justify-content:center;line-height:1.1}
.acts .icon.small,.cmd .icon.small{flex:none}
.card .name{flex-wrap:wrap}
.card{overflow-wrap:anywhere}
.card .name.agname{flex-wrap:nowrap;justify-content:space-between;gap:10px}
.agn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:600}
.agname .tag{flex:none}
.agsw{margin-top:8px}
select{cursor:pointer}
.vsugwrap{position:relative;flex:1 1 180px;min-width:0}
.vsugwrap input{width:100%}
.vsug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.vsug[hidden]{display:none}
.vsug-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text);margin:0;border-radius:0}
.vsug-i:last-child{border-bottom:0}.vsug-i:hover{background:var(--accent-soft)}
.vsug-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* формы настроек: подпись слева, поле справа, правые края в одну линию */
.cmd>.fld,.cmd>.tools,.cmd>textarea,.cmd>.note,.cmd>.form,.cmd>.name{flex:1 1 100%;min-width:0;width:100%}
.fld{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;margin-top:10px}
.fld>span{min-width:0;overflow-wrap:anywhere}
.fld>input:not([type=checkbox]):not([type=number]),.fld>select{width:min(190px,52vw);max-width:100%;justify-self:end;margin:0;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;box-sizing:border-box;height:36px;padding:0 10px}
.fld>input[type=number]{width:84px;flex:none;justify-self:end;margin:0;box-sizing:border-box;height:36px;padding:0 10px;text-align:right}
.fld>.sw{justify-self:end}
.cmd>.tools{display:flex}.cmd>.tools .sw{width:100%;justify-content:space-between}
.cmd>.tools .sw .swl{order:-1}
.cmd textarea{box-sizing:border-box;margin-top:10px}
textarea{font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus{outline:none;border-color:var(--accent)}
.cfrow .cfi{display:inline-flex;vertical-align:-3px;margin-right:4px;line-height:0}
.cfrow .cfp{opacity:.9}
.cfrow .cfbot{color:var(--accent)}
.cfrow.owner{background:rgba(233,25,22,.08);border-radius:8px;padding:3px 6px;box-shadow:inset 3px 0 0 #e91916}
.cfrow.owner .cfn{color:#ff6b68!important}
.chatsubs{margin:0 0 10px}
.chatcard.chatfull{position:fixed;inset:0;z-index:60;margin:0;border-radius:0;height:100dvh!important;max-height:none;display:flex;flex-direction:column;padding-top:max(10px,env(safe-area-inset-top))}
.chatfull .feedfill{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.chatfull .feedfill .cflist{flex:1 1 auto;max-height:none;min-height:0}
.cwprev{width:100%;height:300px;border:1px solid var(--line);border-radius:12px;background:#1a1a22;display:block;margin:10px 0}
.cwpresets,.cwplats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cwplats .chipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:13px}
.cwsec{border-top:1px solid var(--line);padding:6px 0}
.cwsec>summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none}
.cwsec>summary::-webkit-details-marker{display:none}
.cwsec>summary::after{content:"▾";float:right;color:var(--muted)}
.cwsec[open]>summary::after{content:"▴"}
.fld .rw{display:flex;align-items:center;gap:10px;justify-self:end}
.fld .rw input[type=range]{width:min(150px,38vw);accent-color:var(--accent)}
.fld .rw .rv{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.fld input.colorin{width:56px;height:36px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg);justify-self:end}
.legal{display:flex;gap:16px;justify-content:center;margin:22px 0 8px;font-size:13px}.legal a{color:var(--muted)}.legal a:hover{color:var(--accent)}
#wn_dummy{display:none}
.wn-body{max-height:min(60vh,520px);overflow:auto;font-size:13.5px;line-height:1.5;text-align:left}
.wn-entry{margin:0 0 16px}.wn-entry+.wn-entry{border-top:1px solid var(--line);padding-top:12px}
.wn-head{font-size:13px}.wn-title{font-weight:600;margin:2px 0 8px}
.wn-sec{margin:0 0 8px}.wn-sec>b{display:block;margin-bottom:3px;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.wn-sec ul{margin:0;padding-left:18px}.wn-sec li{margin:3px 0}
.evlive.red{background:var(--bad)}
.evlive.idle{background:var(--muted)}
.evlive.off{background:var(--muted);animation:none;opacity:.7}
.streamstat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 0 6px}
.streamrow{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.streamrow>.streamstat{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;margin:0;padding:3px 11px;min-height:30px;font-size:13px;line-height:1.2;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:9px;box-sizing:border-box;white-space:nowrap;cursor:pointer}
.streamrow>.streamstat .evlive{margin:0}
.streamrow>.streamstat .uiic{color:var(--accent);display:inline-flex;margin-left:2px}
.streamrow>.streamstat:hover,.streamrow>.streamstat:focus-visible{border-color:var(--accent)}
/* помощники симметрии (DESIGN.md, раздел 4): новые элементы собираем из них */
:root{--ctl-sm:30px;--ctl:36px}
.u-row{display:flex;align-items:center;gap:10px}
.u-row-c{display:flex;align-items:center;justify-content:center;gap:10px}
.u-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.u-pair>*{min-height:var(--ctl-sm);display:inline-flex;align-items:center;justify-content:center;margin:0}
.u-field{display:grid;gap:4px;min-width:0;text-align:center;justify-items:stretch}
.u-field>span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.u-field>select,.u-field>input{width:100%;min-width:0;height:var(--ctl);box-sizing:border-box}
.u-cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.subseg button.off:not(.on){opacity:.55}
.btabs{display:flex;gap:2px;margin:6px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.btabs button{background:none;border:0;border-radius:10px 10px 0 0;padding:9px 16px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap;box-shadow:inset 0 -2px 0 transparent}
.btabs button.on{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 0 -2px 0 var(--accent)}
.acttools{display:grid;gap:10px;margin-bottom:12px}
.vtchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tplchip{display:inline-flex;align-items:center;gap:2px}
.u-cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vtch{display:grid;gap:8px}
.vtrow{display:flex;align-items:center;gap:8px}
.vtrow .ctl{flex:1}
.vtcnt{font-size:12px;color:var(--muted);white-space:nowrap;min-width:34px;text-align:right}
.vthead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.vthead strong,.vtname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vtres{display:grid;gap:6px;margin:10px 0}
.u-nowrap{white-space:nowrap}
/* единый вид полей ввода; подвал со ссылками: на узком экране каждая ссылка отдельной строкой по центру */
.ctl{font:inherit;font-size:14px;height:var(--ctl);box-sizing:border-box;width:100%;min-width:0;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.u-pair>.ctl{justify-content:flex-start}
.legal{flex-wrap:wrap;gap:8px 18px;text-align:center}
.legal a{white-space:nowrap}
@media(max-width:560px){.legal{flex-direction:column;align-items:center;gap:10px}}
.fgrow{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.fgrow .fghead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.fgrow .fgname{display:flex;align-items:center;gap:8px;min-width:0}
.fgrow .fgname strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fgrow .fgacts{display:flex;align-items:center;gap:8px}
/* кнопки внутри строк и заголовков карточек: без общего отступа сверху (он сдвигал их ниже соседей) и без переноса текста */
.row>button,.cardhead>button,.cardhead>a,.acts>button,.form>button,.tools>button{margin-top:0}
.cardhead>button,.cardhead>.pill,.cardhead>.tag{flex:none;white-space:nowrap}
.cardhead>strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.sel3c{display:grid;gap:4px;min-width:0;font-size:12px;color:var(--muted);text-align:center;justify-items:stretch}
.sel3c>span{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel3c select{width:100%;min-width:0;height:36px;margin:0;padding:0 8px;font:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;box-sizing:border-box;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.streamstat .evlive{margin:0}
.themerows{display:grid;gap:10px;grid-template-columns:1fr}
.themerow{display:flex;align-items:stretch;gap:10px}
.themerow .themechoice{flex:1;min-width:0}
.themerow .themetoggle{width:56px;height:auto;min-height:56px;flex:none;border-radius:14px}
.spbar{display:flex;align-items:center;gap:10px;padding:10px 14px}.spbar .spname{display:flex;align-items:center;gap:8px}.spbar .sstat{font-size:13px}.spbar .sstat.ok{color:var(--ok)}.spbar .sstat.off{color:var(--muted)}.spbar button{margin-left:auto;margin-top:0}
.agside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.agside .tag{font-size:11px;padding:1px 8px;margin:0}.agside .acts{display:flex;gap:6px;flex-wrap:nowrap}

.form.btns,.form.btns2{flex-wrap:wrap;align-items:center;gap:8px}

.form.btns2>button{flex:1 1 max-content!important}
.form.stick{position:sticky;bottom:8px;z-index:6;background:var(--card);padding:8px;margin:10px -4px 0;border:1px solid var(--line);border-radius:12px;box-shadow:0 -8px 20px rgba(0,0,0,.28);flex-wrap:wrap}
.form.cmdctl{flex-wrap:nowrap;align-items:center;gap:8px}

.cdw{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}.cdw input{width:66px!important;height:34px;text-align:right}
.fldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px 12px;margin-top:8px}
.fldgrid .fld{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;margin:0}
.fldgrid .fld>span{font-size:12px;color:var(--muted);flex:none;text-align:center}
.fldgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.cmd>input[type=text],.cmd>input:not([type]){display:block;width:100%;box-sizing:border-box;margin-top:8px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px}

.tools{margin-top:6px}
.cmd>.fldgrid,.cmd>.form.btns,.cmd>.form.btns2{flex:1 1 100%;width:100%}

<body>
<main>
  <header class="top">
    <a class="brand" href="./" aria-label="XBot: на главную"><img src="insidex-mark.svg" width="38" height="38" alt=""><div><b>XBot</b><small>Твой канал. Твои правила.</small></div></a>
    <div class="top-actions" id="auth"></div>
  </header>
  <div id="tip"></div>
  <div id="msg" onclick="show('')"></div>
  <div id="app"></div>
</main>
<script>window.API_URL="";</script>
<script>
// ---------- реестр привязок и модулей (с сервера; новые пункты появляются без правок сайта) ----------
var REG = null;
var REG_FALLBACK = {
  login: [{id:"twitch",title:"Twitch",brand:"Twitch",status:"ready"},{id:"discord",title:"Discord",brand:"Discord",status:"ready"}],
  streaming: [{id:"twitch",title:"Twitch",brand:"Twitch",status:"ready"}],
  music: [{id:"spotify",title:"Spotify",brand:"Spotify",status:"ready"}],
  agent_capabilities: []
};
function regList(name){ return (REG&&REG[name])||REG_FALLBACK[name]||[]; }
async function loadRegistry(){
  try{ var r = await fetch(window.API_URL+"/api/registry"); if(r.ok) REG = await r.json(); }catch(e){}
}
// карточки подключений: готовые модули имеют свои карточки, остальное из реестра выводится заглушкой «В разработке»
var READY_CARDS = {
  twitch: [
    {p:"twitch", r:"streamer", brand:"Twitch", title:"Аккаунт стримера", desc:"Награды за баллы канала (заказ песен), список зрителей, подписки."},
    {p:"twitch", r:"bot", key:"bot", pool:true, brand:"Twitch", title:"Аккаунт бота", desc:"Основной бот: общается в чате, выполняет команды и ведёт учёт зрителей. Войдите в аккаунт бота в приватном окне браузера."}
  ],
  spotify: [{p:"spotify", r:"main", key:"spotify", pool:true, brand:"Spotify", title:"Аккаунт Spotify", desc:"Очередь и управление воспроизведением (нужен Premium). Заказы песен идут от Twitch-аккаунта стримера."}],
  agent: [{agent:true}]
};
function cardsFor(){
  var out = [{h:"Стриминговые сервисы"}];
  function add(list){
    list.forEach(function(e){
      out.push({g:e.brand,label:e.title});
      if(e.status==="ready"&&READY_CARDS[e.id]) READY_CARDS[e.id].forEach(function(c){out.push(c);});
      else out.push({soon:true,brand:e.brand,title:"Подключение",desc:e.note||""});
    });
  }
  add(regList("streaming"));
  out.push({h:"Музыка"},{g:"Twitch",label:"Twitch: бот для музыки"},{music:true});
  add(regList("music"));
  return out;
}
function identList(){
  return regList("login").map(function(e){ return {p:e.id,brand:e.brand,title:e.title,soon:e.status!=="ready",note:e.note||""}; });
}

// ---------- приложение на компьютере ----------
var agentsState = null, pairInfo = null;
async function loadAgents(){ try{ agentsState = await api("/api/agents"); }catch(e){ agentsState = null; } }
function capTitle(id){ var c = regList("agent_capabilities").find(function(x){return x.id===id;}); return c?c.title:id; }
async function setSource(type, agentId){
  show("");
  try{
    var d = await api("/api/music/source",{type:type,agent_id:agentId});
    if(!d.ok){ show(d.error||"Ошибка","err"); return; }
    await load(); show(type==="agent"?"Музыка берётся из плеера на компьютере":"Музыка снова из Spotify","good");
  }catch(e){ show(e.message,"err"); }
}
async function startPairing(){
  show("");
  try{
    var d = await api("/api/agents/pair-code",{});
    if(!d.ok){ show(d.error||"Ошибка","err"); return; }
    pairInfo = d; render(meName);
  }catch(e){ show(e.message,"err"); }
}
// Скачивание: открытый репозиторий GitHub, всегда последний релиз
var XBV_REPO = "InsideX-O/insidexbot-whisper";
var XBV_PAGE = "https://github.com/" + XBV_REPO + "/releases/latest";
var xbvInfo = null;
// Последний выпуск приложения: версия и точное имя файла берутся у GitHub (api.github.com отвечает браузеру напрямую, запросов к нашему серверу нет)
function xbvLoad(){
  if(xbvInfo) return Promise.resolve(xbvInfo);
  try{ var c = JSON.parse(sessionStorage.getItem("xbv_latest")||"null"); if(c && c.url && Date.now()-c.at < 120000){ xbvInfo = c; return Promise.resolve(c); } }catch(e){}
  return fetch("https://api.github.com/repos/"+XBV_REPO+"/releases/latest").then(function(r){ return r.json(); }).then(function(d){
    var as = (d && d.assets) || [], a = null, i;
    for(i=0;i<as.length;i++){ if(/setup.*\.exe$/i.test(as[i].name)){ a = as[i]; break; } }
    if(!a) return null;
    var v = (/(\d+\.\d+\.\d+)/.exec(a.name) || /(\d+\.\d+\.\d+)/.exec(String(d.tag_name||"")) || [])[1] || "";
    xbvInfo = {url:a.browser_download_url,name:a.name,version:v,mb:Math.round((a.size||0)/1048576),at:Date.now()};
    try{ sessionStorage.setItem("xbv_latest",JSON.stringify(xbvInfo)); }catch(e){}
    return xbvInfo;
  }).catch(function(){ return null; });
}
function downloadBlock(){
  // Строка на каждую систему: кнопка «Скачать» и сбоку версия. Сейчас только Windows; для Mac или Ubuntu позже добавится такая же строка ниже.
  var label = el("span",{text:"Скачать"}), note = el("span",{"class":"dlnote",text:"Windows"});
  var link = el("a",{href:XBV_PAGE,"class":"btnlink dl",title:"Установщик для Windows"},[uiIcon("download",15),label]);
  xbvLoad().then(function(i){
    if(!i) return;
    link.href = i.url; link.title = i.name + (i.mb ? ", около " + i.mb + " МБ" : "");
    note.textContent = "Windows · XBot " + i.version + (i.mb ? " · " + i.mb + " МБ" : "");
  });
  return el("div",{"class":"dlrows"},[el("div",{"class":"dlrow"},[link,note])]);
}
var NL = String.fromCharCode(10);
// ---------- настройки приложения XBot на компьютере, с сайта ----------
var IN_APP = /XBotApp[/]/.test(navigator.userAgent||""); // внутри самого приложения этих настроек нет: у него своя вкладка Voice (без расхождений)
var appCtl = {tmr:null, refreshTmr:null, note:""};
function appAgent(){ var l = (agentsState&&agentsState.agents)||[]; return l.find(function(a){ return a.online && a.control; }) || null; }
async function appCmd(a,type,payload,okText){
  try{ var d = await api("/api/agents/command",{id:a.id,type:type,payload:payload}); if(!d.ok){ show(d.error||"Не удалось","err"); return false; } if(okText) show(okText,"good"); clearTimeout(appCtl.refreshTmr); appCtl.refreshTmr = setTimeout(async function(){ await loadAgents(); if(tab==="bot") render(meName); },4500); return true; }
  catch(e){ show(e.message,"err"); return false; }
}
function appSettingsCard(){

// ---------- всплывающие подсказки «?» ----------
// Пояснения в коде создаются как .ex; здесь они превращаются в значок «?» рядом с заголовком.
var tipFor = null;
function hideTip(){ var t=$("tip"); if(t) t.style.display="none"; tipFor=null; }
function showTip(h){
  var t=$("tip"); t.textContent=h.getAttribute("data-tip"); t.style.display="block";
  var w=Math.min(300,window.innerWidth-24); t.style.width=w+"px";
  var r=h.getBoundingClientRect();
  // правый край окошка стоит ровно под знаком «?», всё остальное уходит влево; если слева не хватает места, окошко упирается в край экрана
  var left=Math.max(window.scrollX+12,Math.min(r.right+window.scrollX-w,window.scrollX+window.innerWidth-w-12));
  t.style.left=left+"px"; t.style.top=(r.bottom+window.scrollY+8)+"px"; tipFor=h;
}
function helpIcon(text){
  return el("span",{"class":"help",tabindex:"0",role:"button","aria-label":"Подсказка","data-tip":text,text:"?"});
}
// «?» рядом с переключателем всегда стоит сразу после его подписи (внутри неё), а не отдельной точкой в середине строки; если у подписи уже есть свой «?», остаётся один
function tidyHelp(){
  [].slice.call(document.querySelectorAll(".tools > .sw + .help")).forEach(function(h){
    var sw = h.previousElementSibling, l = sw.querySelector(".swl"); if(!l) return;
    var old = l.querySelector(".help"); if(old) old.remove();
    l.appendChild(document.createTextNode(" ")); l.appendChild(h);
    h.addEventListener("click",function(e){ e.preventDefault(); });
  });
}
// два «?» в одном месте (например у заголовка карточки) сливаются в один: тексты подсказок склеиваются
function mergeHelp(){
  var seen = [];
  [].slice.call(document.querySelectorAll("#app .help:not(.fi)")).forEach(function(h){
    var par = h.parentElement; if(!par || seen.indexOf(par)>=0) return; seen.push(par);
    var hs = [].filter.call(par.children,function(c){ return c.classList.contains("help") && !c.classList.contains("fi"); });
    if(hs.length<2) return;
    var texts = []; hs.forEach(function(x){ var t = x.getAttribute("data-tip"); if(t && texts.indexOf(t)<0) texts.push(t); });
    hs[0].setAttribute("data-tip",texts.join("\n\n"));
    hs.slice(1).forEach(function(x){ x.remove(); });
  });
}
function applyHelp(){
  var list = document.querySelectorAll(".ex");
  if(!list.length) return;
  var groups = [];
  Array.prototype.forEach.call(list,function(x){
    var sectionCard = x.closest && x.closest(".card");
    if(sectionCard && sectionCard.querySelector(".builtin-row")) return;
    var host = x.previousElementSibling;
    while(host && !host.classList.contains("name") && !host.classList.contains("cat")) host = host.previousElementSibling;
    if(!host && x.parentNode) host = x.parentNode.querySelector(".name");
    if(!host){ x.parentNode.replaceChild(helpIcon(x.textContent),x); return; }
    var g = groups.find(function(e){return e.host===host;});
    if(!g){ g={host:host,texts:[]}; groups.push(g); }
    g.texts.push(x.textContent);
    x.parentNode.removeChild(x);
  });
  groups.forEach(function(g){ g.host.appendChild(helpIcon(g.texts.join("\n\n"))); });
}
(function(){
  var hoverable = window.matchMedia && matchMedia("(hover:hover)").matches;
  document.addEventListener("click",function(e){
    var h = e.target.closest && e.target.closest(".help");
    if(!h){ hideTip(); return; }
    if(tipFor===h) hideTip(); else showTip(h);
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") hideTip(); });
  if(hoverable){
    document.addEventListener("mouseover",function(e){ var h=e.target.closest&&e.target.closest(".help"); if(h&&tipFor!==h) showTip(h); });
    document.addEventListener("mouseout",function(e){ var h=e.target.closest&&e.target.closest(".help"); if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget))) hideTip(); });
  }
  new MutationObserver(function(){ applyHelp(); tidyHelp(); mergeHelp(); }).observe(document.body,{childList:true,subtree:true});
})();

// Свои окна вместо телефонных: любой <select> открывает наш список выбора, значение и событие change те же
(function(){
  var busy = false;
  async function pick(sel){
    if(busy || sel.disabled || sel.closest(".dlg")) return;
    busy = true;
    try{
      var opts = [].slice.call(sel.options).filter(function(o){ return !o.disabled; }).map(function(o){ return {value:o.value,label:o.textContent.trim()||"—"}; });
      var lab = sel.closest("label,.row,.field,.form"), t = "";
      if(lab){ var l = lab.querySelector("label,.lbl,.fl"); t = (l&&l.textContent||lab.firstChild&&lab.firstChild.textContent||"").trim().slice(0,60); }
      var v = await uiChoose(t||sel.getAttribute("aria-label")||"Выбор",opts,sel.value);
      if(v!==null && v!==undefined && v!==sel.value){ sel.value = v; sel.dispatchEvent(new Event("input",{bubbles:true})); sel.dispatchEvent(new Event("change",{bubbles:true})); }
    } finally { busy = false; sel.blur(); }
  }
  function hit(e){ var t = e.target; return t && t.closest ? t.closest("select") : null; }
  ["mousedown","click"].forEach(function(ev){
    document.addEventListener(ev,function(e){ var s = hit(e); if(!s) return; e.preventDefault(); if(ev==="click") pick(s); },true);
  });
  document.addEventListener("keydown",function(e){ var s = hit(e); if(s && (e.key==="Enter"||e.key===" "||e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); pick(s); } },true);
})();

    if(/что делать|действие/.test(t)) return ["settings"];
    return null;
  }
  [].slice.call(app.querySelectorAll(".fldgrid .fld>span:first-child")).forEach(function(sp){
    var txt = sp.textContent.trim(), ic = null; if(!ic) return;
    var h = el("span",{"class":"help fi",tabindex:"0",role:"button","aria-label":txt,"data-tip":txt,title:txt},ic.map(function(n){ return uiIcon(n,15); }));
    h.addEventListener("click",function(e){ e.stopPropagation(); show(txt); });
    sp.replaceWith(h);
  });
  // 4. пояснения в скобках: подпись короче, подробности в «?»
  [].slice.call(app.querySelectorAll(".fld>span:first-child, .sw .swl")).forEach(function(sp){
    if(sp.querySelector(".help")) return;
    var m = /^(.*?)\s*\(([^()]{4,})\)\s*:?$/.exec(sp.textContent.trim());
    if(!m || !m[1]) return;
    sp.textContent = m[1]; sp.appendChild(document.createTextNode(" ")); sp.appendChild(helpIcon(m[2].charAt(0).toUpperCase()+m[2].slice(1)));
  });
}
var BTN_ICONS = {"Изменить":"edit","Редактировать":"edit","Удалить":"trash","Копировать":"copy","Обновить":"refresh","В таймер":"timers","Предпросмотр":"eye","Предпросмотр ответа":"eye","Сбросить":"reset","Переименовать":"edit","Убрать":"close","Отключить":"logout","Отвязать":"logout","Скрыть":"eye","Восстановить":"reset",};
function compactUi(){
  var app = $("app"); if(!app) return;
  compactForms(app);
  enhancePickers(app);
  if(!app.querySelector(".legal") && !app.querySelector(".chatfull")) app.appendChild(el("div",{"class":"legal"},[el("a",{href:"/privacy",target:"_blank",rel:"noopener",text:"Конфиденциальность"}),el("a",{href:"/terms",target:"_blank",rel:"noopener",text:"Условия использования"}),el("a",{href:"#",text:"Что нового",onclick:function(e){ e.preventDefault(); wnShow(false); }})]));
  // активная вкладка в полосах с прокруткой всегда по центру (иначе на телефоне уезжает за край)
  [].slice.call(app.querySelectorAll(".tabs.scroll, .subseg")).forEach(function(bar){
    var on = bar.querySelector(".on"); if(!on || bar.scrollWidth<=bar.clientWidth) return;
    bar.scrollLeft = on.offsetLeft - (bar.clientWidth-on.offsetWidth)/2;
  });
  [].slice.call(app.querySelectorAll("button.small, button.ghost")).forEach(function(b){
    if(b.dataset.ic || b.querySelector("svg") || b.closest(".dlg")) return;
    var t = b.textContent.trim(), ic = BTN_ICONS[t];
    if(!ic) return;
    b.dataset.ic = ic; b.setAttribute("aria-label",t); b.title = t; b.textContent = ""; b.appendChild(uiIcon(ic,15));
    b.classList.add("icon","small"); b.classList.remove("ghost");
  });
  [].slice.call(app.querySelectorAll(".card")).forEach(function(card){
    if(card.querySelector(".builtin-row")) return;
    var host = null;
    [].slice.call(card.children).forEach(function(c){ if(!host && (c.classList.contains("name") || c.classList.contains("cardhead"))) host = c; });
    if(!host) return;
    [].slice.call(card.children).forEach(function(ch){
      if(!ch.classList.contains("desc") || ch.textContent.length < 70) return;
      var ex = host.querySelector(".help");
      if(ex) ex.setAttribute("data-tip",ex.getAttribute("data-tip")+String.fromCharCode(10,10)+ch.textContent);
      else host.appendChild(helpIcon(ch.textContent));
      ch.remove();
    });
  });
}
function renderView(name){
  var auth=$("auth"); auth.textContent="";
  var app=$("app"); app.textContent="";
  if(!token){
    if(mfaTicket){ renderMfaLogin(app); return; }
    renderLoginModal(app);
    return;
  }
  if(tab==="connections") tab = "overview";
  auth.appendChild(menuButton(name));
  app.appendChild(channelBar());
  app.appendChild(tabsBar());

  if(tab==="help"){renderHelp(app);return;}
  if(tab==="chat"){renderChatTab(app);return;}
  if(tab==="overview"){renderOverview(app);return;}
  if(tab==="profiles"){renderProfiles(app);return;}

// Подключения активного профиля: стриминговые сервисы, музыка, боты
function renderConnections(app){
  cardsFor().forEach(function(c){
    if(c.h){app.appendChild(el("h2",{text:c.h}));return;}
    if(c.agent){app.appendChild(agentsCard());return;}
    if(c.music){app.appendChild(musicCard());return;}
    if(c.song){app.appendChild(songCard());return;}
    if(c.profiles){app.appendChild(profilesCard());return;}
    if(c.limits){app.appendChild(limitsCard());return;}
    if(c.blocklist){app.appendChild(blocklistCard());return;}
    if(c.cmds){app.appendChild(cmdsCard());return;}
    if(c.single){app.appendChild(singleCard());return;}
    if(settings.single_account&&c.p==="twitch"&&c.r==="bot"){app.appendChild(linkedCard("Аккаунт бота"));return;}
    if(c.pool){app.appendChild(poolCard(c));return;}
    if(c.g){
      var gl=el("div",{"class":"grp"},[icon(c.g,18),el("span",{text:c.label||c.g})]);
      gl.querySelector("span").style.color=BRAND[c.g].color;
      app.appendChild(gl);return;
    }
    var have=c.soon?null:conns.find(function(x){return x.provider===c.p&&x.role===c.r});
    var color=BRAND[c.brand].color;
    var info=el("div",{},[el("div",{"class":"name",text:c.title}),el("div",{"class":"ex",text:c.desc})]);
    var acts=el("div",{"class":"acts"});
    if(c.soon){
      acts.appendChild(el("span",{"class":"soon",text:"В разработке"}));
    }else{
      var who=have?(have.display_name||have.account_login||""):"";
      var st=el("div",{"class":"status "+(have?"ok":"off")});
      if(have){st.appendChild(document.createTextNode("Подключено: "));var nm=el("b",{text:who});nm.style.color=color;st.appendChild(nm);}
      else{st.textContent="Не подключено";}
      info.appendChild(st);
      if(c.p==="twitch"&&c.r==="bot"&&have){var mn=modNote(have);if(mn)info.appendChild(mn);}
      if(c.p==="twitch"&&c.r==="streamer"&&have){
        var tools = el("div",{"class":"tools"});
        if(!settings.single_account&&conns.some(function(x){return x.provider==="twitch"&&(x.role==="bot"||x.role==="music_bot")})){
          tools.appendChild(el("button",{"class":"ghost small",text:"Сделать ботов модераторами",onclick:grantMod}));
        }
        tools.appendChild(switchEl("Использовать для всего",!!settings.single_account,setSingle));
        info.appendChild(tools);
        if(settings.single_account&&(have.scopes||[]).indexOf("user:write:chat")<0){
          info.appendChild(el("div",{"class":"note warn",text:"Чтобы бот писал от вашего имени, нажмите «Переподключить»: нужно право писать в чат."}));
        }
      }
      acts.appendChild(el("button",{text:have?"Переподключить":"Подключить",onclick:function(){connect(c)}}));
      if(have)acts.appendChild(el("button",{"class":"ghost",text:"Отключить",onclick:function(){drop(c)}}));
    }
    app.appendChild(el("div",{"class":"card conn"},[avatar(have&&have.avatar_url,c.brand,!have),info,acts]));
  });
}
async function load(){
  var name="";
  try{var d=await api("/api/me");conns=d.connections||[];name=d.name||"";meName=name;meAvatar=d.avatar||null;account=d.account||null;settings=d.settings||{};botMod=d.bot_mod||null;}catch(e){show(e.message,"err");}
  await loadSong();
  await loadBlocklist();
  await loadSessions();
  await loadMfa();
  await loadChannels();
  await loadAgents();
  render(name);
}
async function connect(c){
  show("");
  try{var d=await api("/api/connect",{provider:c.p,role:c.r});location.href=d.url;}catch(e){show(e.message,"err");render();}
}
async function drop(c){
  if(!await uiConfirm("Отключить: "+c.brand+", "+c.title.toLowerCase()+"?"))return;
  try{var r=await api("/api/disconnect",{provider:c.p,role:c.r});if(r&&r.ok===false){show(r.error||"Не удалось отключить","err");return;}await load();show("Отключено","good");}catch(e){show(e.message,"err");}
}
// ---------- «Что нового»: журнал обновлений (web/changelog.json), как у Lex; сайт показывает свои пункты, приложение свои ----------
var WN_TYPES = {add:"Добавлено", chg:"Изменено", fix:"Исправлено", del:"Удалено"};
var wnData = null;
async function wnLoad(){
  if(wnData) return wnData;
  try{ var r = await fetch("/changelog.json?"+Date.now(),{cache:"no-store"}); var d = await r.json(); wnData = (d.entries||[]); }catch(e){ wnData = []; }
  return wnData;
}
function wnEntryEl(e){
  var box = el("div",{"class":"wn-entry"},[el("div",{"class":"wn-head"},[el("b",{text:e.id}),el("span",{"class":"muted",text:" · "+new Date(e.date).toLocaleDateString("ru-RU")})]),el("div",{"class":"wn-title",text:e.title})]);
  ["add","chg","fix","del"].forEach(function(t){
    var list = (e.items||[]).filter(function(x){ return x.t===t && (x.k==="site"||x.k==="both"); });
    if(!list.length) return;
    box.appendChild(el("div",{"class":"wn-sec"},[el("b",{text:WN_TYPES[t]}),el("ul",{},list.map(function(x){ return el("li",{text:x.x}); }))]));
  });
  return box;
}
function wnHasSite(e){ return (e.items||[]).some(function(x){ return x.k==="site"||x.k==="both"; }); }
// «Что нового»: сверху состояние приложения XBot на компьютере. Есть новая версия: кнопка «Обновить» (приложение само скачает, проверит и перезапустится); версия последняя: короткая строка
async function wnUpdateBlock(){
  try{
    await loadAgents();
    var a = agentsState && (agentsState.agents||[]).find(function(x){ return x.online && x.control; });
    if(!a) return null;
    var c = a.control;
    if(c.update) return el("div",{"class":"note"},[el("div",{text:"Для приложения XBot на компьютере есть новая версия "+c.update+" (у вас "+c.version+")."}),
      el("div",{"class":"form"},[el("button",{text:"Обновить",onclick:function(){ dlgClose(null); appCmd(a,"app.update",{},"Обновление запущено: приложение перезапустится"); }})])]);
    return el("div",{"class":"desc",text:"Приложение XBot на компьютере: последняя версия "+c.version+"."});
  }catch(e){ return null; }
}
async function wnShow(onlyNew){
  var all = (await wnLoad()).filter(wnHasSite), seen = ""; try{ seen = localStorage.getItem("xbot_wn_site")||""; }catch(e){}
  var list = onlyNew ? all.slice(0, all.findIndex(function(e){ return e.id===seen; })<0 ? 1 : all.findIndex(function(e){ return e.id===seen; })) : all.slice(0,5);
  if(!list.length) return;
  try{ localStorage.setItem("xbot_wn_site",all[0].id); }catch(e){}
  var upd = await wnUpdateBlock();
  await dlgShow({title:"Что нового",body:[upd,el("div",{"class":"wn-body"},list.map(wnEntryEl))].filter(Boolean),cancelValue:null,actions:[{text:"Круто",kind:"main",value:"ok"}]});
}
async function wnAuto(){
  var all = (await wnLoad()).filter(wnHasSite); if(!all.length) return;
  var seen = null; try{ seen = localStorage.getItem("xbot_wn_site"); }catch(e){}
  if(seen===null){ try{ localStorage.setItem("xbot_wn_site",all[0].id); }catch(e){} wnShow(false); return; } // первый заход: показываем свежий выпуск
  if(seen!==all[0].id) wnShow(true);
}
// Вход в приложение XBot: приложение открывает сайт с ?applink=1&port=…&state=…. Если вход в браузере уже выполнен, страница сразу передаёт приложению одноразовый код привязки и сессию
// (переходом на локальный адрес приложения 127.0.0.1); если нет, человек входит как обычно, и передача происходит после входа. Запасной путь: ссылка xbot://
async function appHandoffMaybe(){
  var on = false, port = "", st = "", host = ""; try{ on = sessionStorage.getItem("applink")==="1"; port = sessionStorage.getItem("applink_port")||""; st = sessionStorage.getItem("applink_state")||""; host = sessionStorage.getItem("applink_host")||""; }catch(e){}
  if(!on || !token) return;
  try{ ["applink","applink_port","applink_state","applink_host"].forEach(function(k){ sessionStorage.removeItem(k); }); }catch(e){}
  try{
    var d = await api("/api/agents/pair-code",{host:host});
    if(!d || !d.ok){ show((d&&d.error)||"Не удалось получить код привязки","err"); return; }
    if(/^\d{4,5}$/.test(port) && /^[a-f0-9]{32}$/.test(st)){
      show("Вход передаётся в приложение XBot…","good");
      location.href = "http://127.0.0.1:"+port+"/cb?code="+encodeURIComponent(d.code)+"&s="+encodeURIComponent(token)+"&state="+st;
      return;
    }
    var url = "xbot://login?s="+encodeURIComponent(token)+"&code="+encodeURIComponent(d.code);
    await dlgShow({title:"Вход в приложение XBot",body:[el("p",{text:"Нажмите кнопку, чтобы открыть приложение XBot на этом компьютере: оно войдёт в ваш аккаунт и привяжется само."})],cancelValue:null,actions:[{text:"Открыть приложение",kind:"main",value:function(){ location.href = url; return "open"; }}]});
  }catch(e){ show(e.message,"err"); }
}
(function init(){
  try{
    var sp = new URLSearchParams(location.search);
    if(sp.get("applink")==="1"){
      sessionStorage.setItem("applink","1"); sessionStorage.setItem("applink_port",sp.get("port")||""); sessionStorage.setItem("applink_state",sp.get("state")||""); sessionStorage.setItem("applink_host",String(sp.get("host")||"").slice(0,60));
      history.replaceState(null,"",location.pathname+location.hash);
    }
  }catch(e){}
  var h=location.hash.replace(/^#/,""), q=new URLSearchParams(h);
  if(q.get("session")||q.get("mfa")){
    var ln=q.get("ln"), stored=null; try{ stored=sessionStorage.getItem("login_n"); }catch(e){}
    if(!ln||!stored||ln!==stored){ show("Вход начат в другом браузере или устарел. Нажмите кнопку входа ещё раз.","err"); }
    else{
      try{ sessionStorage.removeItem("login_n"); }catch(e){}
      if(q.get("session")) setToken(q.get("session")); else mfaTicket=q.get("mfa");
    }
  }
  else if(q.get("connected")){show("Подключено","good");}
  else if(q.get("linked")){show("Способ входа привязан","good");}
  else if(q.get("error")){show(q.get("error"),"err");}
  var cb = !!(q.get("session")||q.get("mfa")||q.get("connected")||q.get("linked")||q.get("error"));
  if(h && cb)history.replaceState(null,"",location.pathname); // параметры входа и подключения стираются из адреса, а маршрут экрана (#/…) остаётся
  loadRegistry().then(function(){
    if(token){
      var saved = ""; try{ saved = localStorage.getItem("route") || ""; }catch(e){}
      // экран из адреса (прямая ссылка, обновление), иначе последний открытый; после входа или подключения возвращаемся на последний открытый
      if(!applyRoute(cb ? saved : (location.hash || saved)) && saved) applyRoute(saved);
      Promise.resolve(load()).then(appHandoffMaybe).then(function(){ syncThemePrefs(); if(!IN_APP) wnAuto(); });
    }else render();
  });
})();
