: учитывай, что вы только что обсуждали. Каждый ответ свежий: не повторяй зачины, шутки и обороты из своих прошлых ответов и не отвечай разным людям одной и той же шуткой.\",\"label\":\"Правило свежести ответа\",\"hint\":\"Как пользоваться контекстом и не повторяться.\"},{\"k\":\"extra\",\"g\":\"style\",\"t\":\"text\",\"max\":1200,\"def\":\"Правила поведения: не выдумывай факты, особенно про стримера: говори только то, что он реально сказал вслух или что есть в сводке чата и в истории общения. Если не понял сообщение, ответь шуткой или переспроси одним коротким вопросом. Не здоровайся повторно с тем, с кем уже здоровался. Не обещай то, чего не умеешь (розыгрыши, заказ песен, команды). Не подкалывай по национальности, здоровью, семье и внешности: на Twitch за это банят канал.\",\"label\":\"Дополнительные указания\",\"hint\":\"Правила поведения: что нельзя, как себя вести.\"},{\"k\":\"temperature\",\"g\":\"models\",\"t\":\"num\",\"min\":0,\"max\":2,\"step\":0.1,\"def\":0.8,\"label\":\"Творчество (температура)\",\"hint\":\"0 = строго, 2 = очень свободно.\"},{\"k\":\"model_deepseek\",\"g\":\"models\",\"t\":\"str\",\"max\":60,\"def\":\"\",\"label\":\"Модель DeepSeek\",\"hint\":\"Пусто = deepseek-chat (быстро и дёшево). deepseek-reasoner рассуждает дольше.\"},{\"k\":\"model_openai\",\"g\":\"models\",\"t\":\"str\",\"max\":60,\"def\":\"\",\"label\":\"Модель OpenAI\",\"hint\":\"Пусто = gpt-4o-mini. Чем новее и умнее модель, тем дороже.\"},{\"k\":\"price_deepseek_in\",\"g\":\"cost\",\"t\":\"num\",\"min\":0,\"max\":100,\"step\":0.01,\"def\":0.27,\"label\":\"Цена DeepSeek, вход: $ за 1 млн токенов\",\"hint\":\"Нужна только для оценки на странице «Расход». Цены меняются: сверьтесь с сайтом провайдера.\"},{\"k\":\"price_deepseek_out\",\"g\":\"cost\",\"t\":\"num\",\"min\":0,\"max\":100,\"step\":0.01,\"def\":1.1,\"label\":\"Цена DeepSeek, выход: $ за 1 млн токенов\",\"hint\":\"\"},{\"k\":\"price_openai_in\",\"g\":\"cost\",\"t\":\"num\",\"min\":0,\"max\":100,\"step\":0.01,\"def\":0.15,\"label\":\"Цена OpenAI, вход: $ за 1 млн токенов\",\"hint\":\"\"},{\"k\":\"price_openai_out\",\"g\":\"cost\",\"t\":\"num\",\"min\":0,\"max\":100,\"step\":0.01,\"def\":0.6,\"label\":\"Цена OpenAI, выход: $ за 1 млн токенов\",\"hint\":\"\"},{\"k\":\"timezone\",\"g\":\"context\",\"t\":\"enum\",\"def\":\"Europe/Moscow\",\"label\":\"Часовой пояс канала\",\"hint\":\"По нему чат, речь стримера и история каждого зрителя делятся по дням (а при стриме: день и номер стрима в этом дне).\",\"opts\":[[\"Europe/Moscow\",\"Москва\"],[\"Europe/Kyiv\",\"Киев\"],[\"Europe/Minsk\",\"Минск\"],[\"Asia/Almaty\",\"Алма-Ата\"],[\"Asia/Tashkent\",\"Ташкент\"],[\"Asia/Yekaterinburg\",\"Екатеринбург\"],[\"Asia/Omsk\",\"Омск\"],[\"Asia/Novosibirsk\",\"Новосибирск\"],[\"Asia/Krasnoyarsk\",\"Красноярск\"],[\"Asia/Vladivostok\",\"Владивосток\"],[\"Europe/Berlin\",\"Берлин\"],[\"Europe/London\",\"Лондон\"],[\"America/New_York\",\"Нью-Йорк\"],[\"America/Los_Angeles\",\"Лос-Анджелес\"],[\"UTC\",\"UTC\"]]},{\"k\":\"chat_window_min\",\"g\":\"context\",\"t\":\"int\",\"min\":1,\"max\":120,\"def\":15,\"label\":\"Окно общего чата, мин\",\"hint\":\"За какое время бот видит сообщения чата.\"},{\"k\":\"chat_lines\",\"g\":\"context\",\"t\":\"int\",\"min\":0,\"max\":50,\"def\":12,\"label\":\"Сообщений общего чата в запросе\",\"hint\":\"\"},{\"k\":\"dialog_window_min\",\"g\":\"context\",\"t\":\"int\",\"min\":1,\"max\":120,\"def\":10,\"label\":\"Окно диалога с человеком, мин\",\"hint\":\"Свежий разговор именно с этим зрителем.\"},{\"k\":\"dialog_lines\",\"g\":\"context\",\"t\":\"int\",\"min\":0,\"max\":50,\"def\":10,\"label\":\"Реплик диалога в запросе\",\"hint\":\"\"},{\"k\":\"voice_window_min\",\"g\":\"context\",\"t\":\"int\",\"min\":1,\"max\":60,\"def\":10,\"label\":\"Слова стримера за последние, мин\",\"hint\":\"Что стример говорил вслух (из приложения XBot).\"},{\"k\":\"voice_phrases\",\"g\":\"context\",\"t\":\"int\",\"min\":0,\"max\":50,\"def\":10,\"label\":\"Голосовых фраз в запросе\",\"hint\":\"\"},{\"k\":\"others_phrases\",\"g\":\"context\",\"t\":\"int\",\"min\":0,\"max\":40,\"def\":10,\"label\":\"Фраз из Discord и игр в запросе\",\"hint\":\"Сырой текст речи других людей (Discord, игры) без разбора, кто говорит; работает, если включено «Записывать речь других людей». 0: не передавать.\"},{\"k\":\"voice_chars\",\"g\":\"context\",\"t\":\"int\",\"min\":50,\"max\":1000,\"def\":300,\"label\":\"Длина одной голосовой фразы, символов\",\"hint\":\"\"},{\"k\":\"memory_mode\",\"g\":\"memory\",\"t\":\"enum\",\"opts\":[[\"asked\",\"Когда просят вспомнить\"],[\"always\",\"Всегда искать в истории\"],[\"off\",\"Не искать\"]],\"def\":\"asked\",\"label\":\"Поиск по прошлым разговорам\",\"hint\":\"Чат хранится навсегда. «Когда просят вспомнить»: на «помнишь…», «мы же говорили…» бот ищет похожие сообщения человека за всё время и подставляет в запрос.\"},{\"k\":\"memory_hits\",\"g\":\"memory\",\"t\":\"int\",\"min\":0,\"max\":10,\"def\":5,\"label\":\"Сколько старых сообщений подставлять\",\"hint\":\"0 = не подставлять.\"},{\"k\":\"memory_notes\",\"g\":\"memory\",\"t\":\"bool\",\"def\":true,\"label\":\"Помнить о человеке (заметки, первое и прошлое сообщение)\",\"hint\":\"Бот видит заметки о зрителе (их пишет Gemini по сводкам), когда он впервые писал и когда писал в прошлый раз.\"},{\"k\":\"card_on\",\"g\":\"card\",\"t\":\"bool\",\"def\":true,\"label\":\"Давать ИИ карточку зрителя\",\"hint\":\"Перед ответом ИИ получает карточку собеседника из его профиля (стаж, стримы, манера письма, смайлы, частые слова, настроение, просьбы) и краткие карточки адресата и других людей из разговора, чтобы подстраиваться под каждого.\"},{\"k\":\"card_chat_people\",\"g\":\"card\",\"t\":\"int\",\"min\":0,\"max\":8,\"def\":3,\"label\":\"Сколько других людей из чата описывать\",\"hint\":\"Кроме собеседника и того, кому он пишет, бот видит краткие карточки последних активных зрителей. 0 = только собеседник и адресат.\"},{\"k\":\"card_chars\",\"g\":\"card\",\"t\":\"int\",\"min\":200,\"max\":900,\"def\":520,\"label\":\"Длина карточки собеседника, символов\",\"hint\":\"Чем длиннее, тем больше данных видит ИИ и тем дороже запрос. Лишнее обрезается по важности.\"},{\"k\":\"bday_on\",\"g\":\"bday\",\"t\":\"bool\",\"def\":true,\"label\":\"Запоминать дни рождения\",\"hint\":\"Команда !др 15.03 и ответ зрителя на вопрос бота сохраняются в профиль (только день и месяц, год не хранится).\"},{\"k\":\"bday_ask\",\"g\":\"bday\",\"t\":\"bool\",\"def\":true,\"label\":\"Иногда спрашивать день рождения\",\"hint\":\"Бот ненавязчиво, в конце ответа, спрашивает у знакомых зрителей, у кого дата не заполнена: не чаще раза в 30 дней, не больше трёх раз, отказавшихся больше не спрашивает.\"},{\"k\":\"bday_greet\",\"g\":\"bday\",\"t\":\"bool\",\"def\":true,\"label\":\"Поздравлять с днём рождения\",\"hint\":\"При первом сообщении человека (не раньше 8 утра по часовому поясу канала): за 3 дня бот заводит разговор («скоро день рождения»), в сам день поздравляет, а если человека не было и день рождения прошёл не больше 30 дней назад, поздравляет с опозданием. Дольше месяца не поздравляет. Каждый раз один раз. Текст пишет ИИ по карточке человека.\"},{\"k\":\"arch_on\",\"g\":\"arch\",\"t\":\"bool\",\"def\":true,\"label\":\"Определять архетип зрителей (по Юнгу)\",\"hint\":\"Ориентир по поведению в чате, формируется только при долгом общении и проверяется раз в неделю. Нужен Gemini. Это не психологический тест: ИИ использует его только для тона и не говорит человеку, кто он.\"},{\"k\":\"arch_streams\",\"g\":\"arch\",\"t\":\"int\",\"min\":3,\"max\":100,\"def\":10,\"label\":\"Минимум стримов с сообщениями\",\"hint\":\"Пока зритель был на меньшем числе стримов, архетип не определяется.\"},{\"k\":\"arch_messages\",\"g\":\"arch\",\"t\":\"int\",\"min\":30,\"max\":2000,\"def\":150,\"label\":\"Минимум сообщений\",\"hint\":\"\"},{\"k\":\"arch_days\",\"g\":\"arch\",\"t\":\"int\",\"min\":7,\"max\":365,\"def\":30,\"label\":\"Минимум дней с первого появления\",\"hint\":\"\"},{\"k\":\"forget_days\",\"g\":\"forget\",\"t\":\"int\",\"min\":1,\"max\":30,\"def\":7,\"label\":\"Срок на удаление данных по заявке, дней\",\"hint\":\"Зритель пишет «забудь меня»: создаётся заявка, бот сообщает срок. Данные стирает только стример в панели после подтверждения; пока заявка ждёт, новые сообщения человека не записываются.\"},{\"k\":\"gemini_on\",\"g\":\"gemini\",\"t\":\"bool\",\"def\":false,\"label\":\"Gemini включён\",\"hint\":\"Раз в интервал Gemini читает новый чат целиком и делает ОДНУ сводку на всех: тема, настроение, заметки о людях, кому боту отвечать. Ответы пишет DeepSeek/OpenAI. Нужен ключ GEMINI_API_KEY на сервере.\"},{\"k\":\"gemini_model\",\"g\":\"gemini\",\"t\":\"str\",\"max\":60,\"def\":\"gemini-2.5-flash-lite\",\"label\":\"Модель Gemini\",\"hint\":\"Если такой модели нет, сервер сам выберет доступную flash-lite или flash.\"},{\"k\":\"gemini_interval_s\",\"g\":\"gemini\",\"t\":\"int\",\"min\":10,\"max\":600,\"def\":30,\"label\":\"Не чаще чем раз в, с\",\"hint\":\"Новая сводка делается не раньше, чем через столько секунд после прошлой.\"},{\"k\":\"gemini_min_new\",\"g\":\"gemini\",\"t\":\"int\",\"min\":1,\"max\":100,\"def\":3,\"label\":\"Минимум новых сообщений для сводки\",\"hint\":\"Если новых сообщений меньше, прошлая сводка используется повторно и запроса нет.\"},{\"k\":\"gemini_max_age_s\",\"g\":\"gemini\",\"t\":\"int\",\"min\":30,\"max\":1800,\"def\":180,\"label\":\"Сводка считается свежей, с\",\"hint\":\"Старее этого сводка в ответ не подставляется.\"},{\"k\":\"gemini_messages\",\"g\":\"gemini\",\"t\":\"int\",\"min\":10,\"max\":200,\"def\":60,\"label\":\"Сообщений чата в одном запросе\",\"hint\":\"\"},{\"k\":\"gemini_max_per_hour\",\"g\":\"gemini\",\"t\":\"int\",\"min\":5,\"max\":1000,\"def\":100,\"label\":\"Запросов в час не больше\",\"hint\":\"Защита бесплатного лимита Google.\"},{\"k\":\"gemini_in_reply\",\"g\":\"gemini\",\"t\":\"bool\",\"def\":true,\"label\":\"Давать сводку в запрос на ответ\",\"hint\":\"Выключено: сводка только считается и показывается в панели.\"},{
